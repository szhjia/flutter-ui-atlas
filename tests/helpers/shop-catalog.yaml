# Declarative catalog for a regular Flutter app; enter valid passwords through the local configuration page.
title: Shiwu shop verification
baseUrl: http://127.0.0.1:60212/
routeMode: hash
output: generated
port: 60200
profiles:
  phone:
    width: 393
    height: 852
  pad:
    width: 1024
    height: 768
timeoutMs: 15000
requireObservedEdges: true
sourceFiles:
  - ../lib/main.dart
  - ../lib/app.dart
  - ../lib/pages.dart
  - ../lib/store.dart
  - ../lib/products.dart
  - ../pubspec.yaml
  - ../pubspec.lock
  - ../web/index.html
screens:
  - id: login
    title: Sign in to Shiwu
    roles:
      - '@anonymous'
    route: /login
    group: Sign in
    state: Default
    prepare:
      - action: goto
        url: /#/login
    ready:
      all:
        - not:
            text: Incorrect username or password
        - role: heading
          name: Sign in to Shiwu
        - kind: label
          name: Username
        - kind: label
          name: Password
        - role: button
          name: Sign in
  - id: login-error
    title: Sign in to Shiwu
    roles:
      - '@anonymous'
    route: /login
    group: Sign in
    state: Wrong password
    prepare:
      - action: goto
        url: /#/login
      - action: wait
        ready:
          all:
            - kind: label
              name: Username
            - kind: label
              name: Password
      - action: fill
        target:
          kind: label
          name: Username
        value: user1
      - action: fill
        target:
          kind: label
          name: Password
        value: wrong
      - action: click
        target:
          role: button
          name: Sign in
    ready:
      all:
        - role: heading
          name: Sign in to Shiwu
        - text: Incorrect username or password
        - kind: label
          name: Username
        - kind: label
          name: Password
  - id: home
    title: Home
    route: /home
    group: Shop app
    state: Default
    prepare:
      - action: goto
        url: /#/home
    ready:
      all:
        - role: heading
          name: Home
        - text: 'Account: {{role.username}}'
        - kind: label
          name: 'Cart items: 0'
        - text: SHIWU / EVERYDAY FINDS
        - text: Simple things, made for daily use.
        - role: button
          name: Browse shop
  - id: shop
    title: Shop
    route: /shop
    group: Shop app
    state: Default
    prepare:
      - action: goto
        url: /#/home
      - action: wait
        ready:
          all:
            - role: button
              name: Browse shop
      - action: click
        target:
          role: button
          name: Browse shop
    ready:
      all:
        - role: heading
          name: Shop
        - text: 'Account: {{role.username}}'
        - kind: label
          name: 'Cart items: 0'
        - role: button
          name: View Travel cup
        - role: button
          name: View Canvas tote
        - role: button
          name: View Desk lamp
        - role: button
          name: View Grid notebook
        - role: button
          name: View Desk speaker
        - role: button
          name: View Knit blanket
  - id: detail
    title: Product details
    route: /products/cup
    group: Shop app
    state: Before adding
    prepare:
      - action: goto
        url: /#/shop
      - action: wait
        ready:
          all:
            - role: heading
              name: Shop
            - role: button
              name: View Travel cup
      - action: click
        target:
          role: button
          name: View Travel cup
    ready:
      all:
        - role: heading
          name: Product details
        - text: 'Account: {{role.username}}'
        - kind: label
          name: 'Cart items: 0'
        - role: heading
          name: Travel cup
        - text: ¥69.00
        - role: button
          name: Add to cart
  - id: detail-added
    title: Product details
    route: /products/cup
    group: Shop app
    state: After adding
    prepare:
      - action: goto
        url: /#/shop
      - action: wait
        ready:
          all:
            - role: heading
              name: Shop
            - role: button
              name: View Travel cup
      - action: click
        target:
          role: button
          name: View Travel cup
      - action: wait
        ready:
          all:
            - role: heading
              name: Travel cup
      - action: click
        target:
          role: button
          name: Add to cart
    ready:
      all:
        - role: heading
          name: Product details
        - text: 'Account: {{role.username}}'
        - kind: label
          name: 'Cart items: 1'
        - role: heading
          name: Travel cup
        - text: ¥69.00
        - role: button
          name: View cart
  - id: cart-empty
    title: Cart
    route: /cart
    group: Shop app
    state: Empty cart
    prepare:
      - action: goto
        url: /#/cart
    ready:
      all:
        - role: heading
          name: Cart
        - text: 'Account: {{role.username}}'
        - kind: label
          name: 'Cart items: 0'
        - text: Your cart is empty
        - role: button
          name: Go shopping
  - id: cart-full
    title: Cart
    route: /cart
    group: Shop app
    state: With items
    prepare:
      - action: goto
        url: /#/shop
      - action: wait
        ready:
          all:
            - role: heading
              name: Shop
            - role: button
              name: View Travel cup
      - action: click
        target:
          role: button
          name: View Travel cup
      - action: wait
        ready:
          all:
            - role: heading
              name: Travel cup
      - action: click
        target:
          role: button
          name: Add to cart
      - action: click
        target:
          role: button
          name: View cart
    ready:
      all:
        - role: heading
          name: Cart
        - text: 'Account: {{role.username}}'
        - kind: label
          name: 'Cart items: 1'
        - role: group
          name: 'Travel cup ¥69.00 Travel cup quantity: 1'
        - text: Total ¥69.00
        - role: button
          name: Remove Travel cup
  - id: me
    title: Profile
    route: /me
    group: Shop app
    state: Default
    prepare:
      - action: goto
        url: /#/me
    ready:
      all:
        - role: heading
          name: Profile
        - text: 'Account: {{role.username}}'
        - kind: label
          name: 'Cart items: 0'
        - role: button
          name: My cart Saved per account
        - text: This demo runs locally with no backend. Your session and carts are saved in this browser. Signing out keeps your cart.
        - role: button
          name: Sign out
edges:
  - id: wrong-password
    source: login
    target: login-error
    roles:
      - '@anonymous'
    action: Sign in with wrong password
    steps:
      - action: fill
        target:
          kind: label
          name: Username
        value: user1
      - action: fill
        target:
          kind: label
          name: Password
        value: wrong
      - action: click
        target:
          role: button
          name: Sign in
  - id: login
    source: login
    target: home
    action: Sign in
    steps: []
  - id: browse
    source: home
    target: shop
    action: Browse shop
    steps:
      - action: click
        target:
          role: button
          name: Browse shop
  - id: detail
    source: shop
    target: detail
    action: View Travel cup
    steps:
      - action: click
        target:
          role: button
          name: View Travel cup
  - id: add
    source: detail
    target: detail-added
    action: Add to cart
    steps:
      - action: click
        target:
          role: button
          name: Add to cart
  - id: view-cart
    source: detail-added
    target: cart-full
    action: View cart
    steps:
      - action: click
        target:
          role: button
          name: View cart
  - id: open-empty-cart
    source: shop
    target: cart-empty
    action: Open cart
    steps:
      - action: click
        target:
          role: button
          name: Open cart
  - id: remove
    source: cart-full
    target: cart-empty
    action: Remove Travel cup
    steps:
      - action: click
        target:
          role: button
          name: Remove Travel cup
  - id: continue-shopping
    source: cart-empty
    target: shop
    action: Go shopping
    steps:
      - action: click
        target:
          role: button
          name: Go shopping
  - id: profile
    source: home
    target: me
    action: Profile
    steps:
      - action: click
        target:
          any:
            - role: tab
              name: Profile
            - role: button
              name: Profile Tab 3 of 3
  - id: logout
    source: me
    target: login
    action: Sign out
    steps:
      - action: click
        target:
          role: button
          name: Sign out
