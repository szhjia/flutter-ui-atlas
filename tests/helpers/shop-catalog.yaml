# One page per account and route; enter valid passwords through the local configuration page.
title: Shiwu shop verification
baseUrl: http://127.0.0.1:60212/
routeMode: hash
output: generated
port: 60200
profiles:
  phone:
    width: 393
    height: 852
  pad:
    width: 1024
    height: 768
timeoutMs: 15000
requireObservedEdges: true
sourceFiles:
  - ../lib/main.dart
  - ../lib/app.dart
  - ../lib/pages.dart
  - ../lib/store.dart
  - ../lib/products.dart
  - ../pubspec.yaml
  - ../pubspec.lock
  - ../web/index.html
screens:
  - id: login
    pageName: LoginPage
    title: Sign in to Shiwu
    roles:
      - "@anonymous"
    route: /login
    group: Sign in
    state: Default
    prepare:
      - action: goto
        url: /#/login
    ready:
      all:
        - not:
            text: Incorrect username or password
        - role: heading
          name: Sign in to Shiwu
        - kind: label
          name: Username
        - kind: label
          name: Password
        - role: button
          name: Sign in
  - id: home
    pageName: HomePage
    title: Home
    route: /home
    group: Shop app
    state: Default
    prepare:
      - action: goto
        url: /#/home
    ready:
      all:
        - role: heading
          name: Home
        - text: "Account: {{role.username}}"
        - kind: label
          name: "Cart items: 0"
        - text: SHIWU / EVERYDAY FINDS
        - text: Simple things, made for daily use.
        - role: button
          name: Browse shop
  - id: shop
    pageName: CatalogPage
    title: Shop
    route: /shop
    group: Shop app
    state: Default
    prepare:
      - action: goto
        url: /#/home
      - action: wait
        ready:
          all:
            - role: button
              name: Browse shop
      - action: click
        target:
          role: button
          name: Browse shop
    ready:
      all:
        - role: heading
          name: Shop
        - text: "Account: {{role.username}}"
        - kind: label
          name: "Cart items: 0"
        - role: button
          name: View Travel cup
        - role: button
          name: View Canvas tote
        - role: button
          name: View Desk lamp
        - role: button
          name: View Grid notebook
        - role: button
          name: View Desk speaker
        - role: button
          name: View Knit blanket
  - id: detail
    pageName: ProductPage
    title: Product details
    route: /products/cup
    group: Shop app
    state: Default
    prepare:
      - action: goto
        url: /#/shop
      - action: wait
        ready:
          all:
            - role: heading
              name: Shop
            - role: button
              name: View Travel cup
      - action: click
        target:
          role: button
          name: View Travel cup
    ready:
      all:
        - role: heading
          name: Product details
        - text: "Account: {{role.username}}"
        - kind: label
          name: "Cart items: 0"
        - role: heading
          name: Travel cup
        - text: ¥69.00
        - role: button
          name: Add to cart
  - id: cart
    pageName: CartPage
    title: Cart
    route: /cart
    group: Shop app
    state: Default
    prepare:
      - action: goto
        url: /#/cart
    ready:
      all:
        - role: heading
          name: Cart
        - text: "Account: {{role.username}}"
        - any:
            - all:
                - kind: label
                  name: "Cart items: 0"
                - text: Your cart is empty
                - role: button
                  name: Go shopping
            - all:
                - kind: label
                  name: "Cart items: 1"
                - role: group
                  name: "Travel cup ¥69.00 Travel cup quantity: 1"
                - text: Total ¥69.00
                - role: button
                  name: Remove Travel cup
  - id: me
    pageName: ProfilePage
    title: Profile
    route: /me
    group: Shop app
    state: Default
    prepare:
      - action: goto
        url: /#/me
    ready:
      all:
        - role: heading
          name: Profile
        - text: "Account: {{role.username}}"
        - kind: label
          name: "Cart items: 0"
        - role: button
          name: My cart Saved per account
        - text: This demo runs locally with no backend. Your session and carts are saved
            in this browser. Signing out keeps your cart.
        - role: button
          name: Sign out
edges:
  - id: login
    source: login
    target: home
    action: Sign in
    steps: []
  - id: browse
    source: home
    target: shop
    action: Browse shop
    steps:
      - action: click
        target:
          role: button
          name: Browse shop
  - id: detail
    source: shop
    target: detail
    action: View Travel cup
    steps:
      - action: click
        target:
          role: button
          name: View Travel cup
  - id: view-cart
    source: detail
    target: cart
    action: View cart
    steps:
      - action: click
        target:
          role: button
          name: Add to cart
      - action: wait
        ready:
          all:
            - kind: label
              name: "Cart items: 1"
            - role: button
              name: View cart
      - action: click
        target:
          role: button
          name: View cart
  - id: open-empty-cart
    source: shop
    target: cart
    action: Open cart
    steps:
      - action: click
        target:
          role: button
          name: Open cart
  - id: continue-shopping
    source: cart
    target: shop
    action: Go shopping
    steps:
      - action: click
        target:
          role: button
          name: Go shopping
  - id: profile
    source: home
    target: me
    action: Profile
    steps:
      - action: click
        target:
          any:
            - role: tab
              name: Profile
            - role: button
              name: Profile Tab 3 of 3
  - id: logout
    source: me
    target: login
    action: Sign out
    steps:
      - action: click
        target:
          role: button
          name: Sign out
